name: app_absen
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Tambahan untuk Fitur ML & Kamera
  camera: ^0.11.0
  tflite_flutter: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  image: ^4.2.0 # Untuk konversi & potong frame kamera
  
  # Tambahan untuk Database
  supabase_flutter: ^2.5.4
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model_face_recognition.tflite # Pastikan kamu membuat folder 'assets' dan menaruh file .tflite milikmu di sini
    - assets/labels.txt # (Opsional) Jika ada file label